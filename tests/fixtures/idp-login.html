<!doctype html><meta charset="utf-8"><title>Sign in — Fake IdP</title>
<style>body{font:16px system-ui;max-width:340px;margin:60px auto}
input{display:block;width:100%;padding:10px;margin:8px 0;font-size:16px}
button{padding:10px 18px;font-size:16px}.err{color:#c00}</style>
<h1>Sign in</h1>
<form id="f">
  <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="off">
  <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="off">
  <button id="submit" type="submit">Sign in</button>
  <p id="err" class="err"></p>
</form>
<script>
document.getElementById('f').addEventListener('submit', e => {
  e.preventDefault();
  const email = document.getElementById('email').value;
  const pw = document.getElementById('password').value;
  if (!email || pw !== 'correct-horse') { document.getElementById('err').textContent = 'Invalid credentials'; return; }
  location.href = 'dtffixture://auth?token=idp-issued-token&email=' + encodeURIComponent(email);
});
</script>

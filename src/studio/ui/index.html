<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="dtf-token" content="__DTF_TOKEN__">
  <title>dtf Studio</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23191b1f'/><circle cx='16' cy='16' r='6' fill='%23ff5b4f'/></svg>">
  <link rel="stylesheet" href="/ui/app.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">dtf</span><span class="brand-sub">studio</span>
      </div>
      <div class="project" id="project"></div>
      <div class="topbar-actions">
        <span class="run-indicator" id="run-indicator" hidden></span>
        <button class="btn btn-primary" id="run-all" title="Run every test (⌘/Ctrl+Enter)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z"/></svg>Run all
        </button>
        <button class="btn btn-danger" id="stop-run" hidden>
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="3.5" width="9" height="9" rx="1"/></svg>Stop
        </button>
      </div>
    </header>

    <nav class="sidenav" aria-label="Views">
      <a href="#tests" data-view="tests">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 5h12M4 10h12M4 15h7"/></svg><span>Tests</span>
      </a>
      <a href="#record" data-view="record">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><circle cx="10" cy="10" r="2.5" class="fill"/></svg><span>Record</span>
      </a>
      <a href="#inspect" data-view="inspect">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="M13 13l4 4"/></svg><span>Inspect</span>
      </a>
      <a href="#runs" data-view="runs">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v6l4 2"/><circle cx="10" cy="10" r="7"/></svg><span>Runs</span>
      </a>
      <a href="#doctor" data-view="doctor">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10.5l3.5 3.5L16 5.5"/></svg><span>Doctor</span>
      </a>
      <div class="sidenav-foot" id="conn" title="Live connection to the Studio server"></div>
    </nav>

    <main class="main" id="main"></main>
  </div>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <dialog class="modal" id="modal"></dialog>

  <script type="module" src="/ui/app.js"></script>
</body>
</html>

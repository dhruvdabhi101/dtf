name: Release

# Publishes @dhruvdabhi101/dtf to npm when a v* tag is pushed
# (`npm version minor && git push --follow-tags`).
#
# Each native driver is built on its own OS, then one job gathers both into the
# package, so a single tarball works on macOS and Windows with no toolchain on
# the installing machine. Publishing uses npm Trusted Publishing (OIDC), or the
# NPM_TOKEN secret before that is set up. No --provenance: npm refuses it for a
# private repository.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and pack everything, but do not publish
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  native-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash native/macos/build.sh
      - name: Check it is universal and runs
        run: |
          lipo -archs native/macos/bin/dtfd-macos | grep -q x86_64
          lipo -archs native/macos/bin/dtfd-macos | grep -q arm64
          codesign --verify native/macos/bin/dtfd-macos
      - uses: actions/upload-artifact@v4
        with:
          name: dtfd-macos
          path: native/macos/bin/dtfd-macos
          if-no-files-found: error

  native-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File native/windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: dtfd-windows
          path: native/windows/bin/dtfd-windows.exe
          if-no-files-found: error

  publish:
    needs: [native-macos, native-windows]
    # macOS, not Windows: packing on Windows would drop the executable bit
    # from the macOS driver.
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing + provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@v4
        with:
          name: dtfd-macos
          path: native/macos/bin
      - uses: actions/download-artifact@v4
        with:
          name: dtfd-windows
          path: native/windows/bin
      # Artifacts drop the executable bit; the macOS binary needs it back.
      - run: chmod +x native/macos/bin/dtfd-macos

      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package.json $v"; exit 1; }

      # Trusted Publishing needs npm >= 11.5.
      - run: npm install -g npm@latest
      - run: npm ci --ignore-scripts

      - name: Publish
        if: github.event_name == 'push' || inputs.dry-run == false
        run: npm publish
        env:
          # Only needed for the very first publish, before Trusted Publishing is
          # configured on npmjs.com. Delete the NPM_TOKEN secret after that.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Pack (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run
        run: |
          npm run check && npm run build && node ./scripts/check-package.mjs
          npm pack
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run
        with:
          name: package
          path: '*.tgz'
